[package]
name = "vainger_engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
wasm = []

[dependencies]
# `2d` profile excludes Bevy's 3d/PBR stack. Audio comes from bevy_kira_audio (ogg).
bevy = { version = "0.19", default-features = false, features = [
  "2d",
  "png",
  "dynamic_linking",
  "ui",
] }
bevy_kira_audio = { version = "0.26.0", default-features = false, features = [
  "ogg",
] }
# Keep dim2 only — defaults also enable debug-render / picking helpers we are not using yet.
bevy_asset_loader = { version = "0.27", default-features = false, features = [
  "2d",
] }
noise = "0.9.0"
leafwing-input-manager = "0.21.0"
bevy-inspector-egui = { version = "0.37.0", default-features = false, features = [
  "2d",
  "bevy_gizmos",
  "documentation",
  "egui_clipboard",
] }
bevy_egui = "0.40"
bevy_aseprite_ultra = "0.9.0"
regex = "1"
avian2d = { version = "0.7.0", features = ["diagnostic_ui"] }

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
